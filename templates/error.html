<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ status_code }}</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .error-container {
            text-align: center;
            padding: 2rem;
        }
        h1 { font-size: 4rem; margin: 0; color: #e74c3c; }
        h2 { font-size: 1.5rem; margin: 0.5rem 0; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>{{ status_code }}</h1>
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>
    </div>
</body>
</html>
