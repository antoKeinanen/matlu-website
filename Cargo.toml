[package]
name = "matlu-website"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
askama = "0.16.0"
axum = { version = "0.8", default-features = false, features = ['form', 'json'] }
displaydoc = "0.2.5"
dotenvy = "0.15.7"
hyper = "1.9.0"
pastey = "0.2.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros"] }
tower-service = "0.3.3"
validator = { version = "0.20.0", features = ["derive"] }
serde = "1.0.228"
pulldown-cmark = "0.13.4"
jsonwebtoken = {version = "10.4.0", features = ['rust_crypto'] }
chrono = "0.4.45"
argon2 = "0.5.3"
serde_json = "1.0.150"
axum-extra = { version = "0.12.6", features = ["typed-header"] }

[dependencies.getrandom]
version = "0.2.17"
features = ['js']

[general]
dirs = ["templates/**"]
whitespace = "preserve"
