[package]
name = "matlu-website"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
askama = "0.16.0"
axum = { version = "0.8", default-features = false, features = ['form'] }
displaydoc = "0.2.5"
dotenvy = "0.15.7"
hyper = "1.9.0"
pastey = "0.2.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros"] }
tower-service = "0.3.3"
validator = { version = "0.20.0", features = ["derive"] }
serde = "1.0.228"
pulldown-cmark = "0.13.4"

[general]
dirs = ["templates/**"]
whitespace = "preserve"
