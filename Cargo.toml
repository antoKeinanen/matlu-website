[package]
name = "matlu-website"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
displaydoc = "0.2.5"
dotenvy = "0.15.7"
hyper = "1.9.0"
pastey = "0.2.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.11", features = ["fs"] }
validator = { version = "0.20.0", features = ["derive"] }

[general]
dirs = ["templates/**"]
whitespace = "preserve"
